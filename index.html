<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="진세국의 개인 홈페이지" />
    <title>진세국 | 개인 홈페이지</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #5c687b;
        --paper: #f7f5ef;
        --blue: #2356c7;
        --line: #d7dce5;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 10%, #dae7ff 0, transparent 31rem),
          var(--paper);
        font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      }

      main {
        width: min(100%, 44rem);
        padding: clamp(2.25rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 4.5rem);
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(215, 220, 229, 0.9);
        border-radius: 1.5rem;
        box-shadow: 0 1.25rem 3.5rem rgba(32, 51, 83, 0.1);
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: var(--blue);
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.25rem);
        line-height: 1.08;
        letter-spacing: -0.06em;
      }

      .rule {
        width: 3rem;
        height: 0.25rem;
        margin: 2rem 0;
        background: var(--blue);
        border-radius: 99px;
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        font-weight: 700;
      }

      .intro {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1.125rem, 3vw, 1.375rem);
        line-height: 1.7;
      }

      footer {
        margin-top: 3.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.875rem;
      }

      @media (max-width: 30rem) {
        body { padding: 1rem; }
        main { border-radius: 1.1rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Personal homepage</p>
      <h1>진세국</h1>
      <div class="rule" aria-hidden="true"></div>
      <section aria-labelledby="intro-title">
        <h2 id="intro-title">introduction</h2>
        <p class="intro">
  2007 01 16<br>
  wlstprnr@snu.ac.kr<br>
  서울대학교 첨단융합학부
</p>
      </section>
      <footer>© 2026 진세국</footer>
    </main>
  </body>
</html>
